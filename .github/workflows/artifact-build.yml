name: Artifact Build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, yuha]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to build
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 654654578710.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve commit
        id: commit
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ inputs.commit_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-artifact-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push immutable images
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "$ECR_REGISTRY/music/api:$SHA" \
            --tag "$ECR_REGISTRY/music/worker:$SHA" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push .

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - name: Build web artifact
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ steps.commit.outputs.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 30

      - name: Publish artifact summary
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "### Artifact Build"
            echo ""
            echo "- commit: $SHA"
            echo "- ECR: music/api:$SHA"
            echo "- ECR: music/worker:$SHA"
            echo "- web artifact: web-dist-$SHA"
          } >> "$GITHUB_STEP_SUMMARY"
