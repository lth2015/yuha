# Build, check and test every master commit before QA deployment.
#
# This file was complete and had never run. The triggers were `main` and
# `master`; development happens on `yuha` and goes in without pull requests,
# so from the day the branch was created until 2026-10-02 nothing here
# executed — a full CI suite, green by never having been asked. `yuha` is in
# the list now. So is release: `deploy.yml` fires on `v*` and had no
# dependency on this workflow at all, so tagging shipped code CI had never
# seen — and in practice that was every commit. It now calls this file through
# `workflow_call` and will not deploy unless it passes.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml on the ref being released, so a release runs this
  # whole file before anything ships. Deliberately not also `push: tags` —
  # that would run the suite twice for every release, once here and once as
  # the deploy's gate, and the gate is the one that has to pass.
  workflow_call:
    inputs:
      skip_docker:
        description: Skip the validation-only Docker build when Deploy will build and push once.
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes an older one — but never cancel a tag's run. That
  # run is the gate a deploy is waiting on, and cancelling it fails the deploy
  # with "verification cancelled", which reads like a test failure and is not.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # No `services:` block. A real MySQL 8.0 is still required — §12.1 wants
    # the ledger, concurrency and constraint tests run against the actual
    # engine — but `services:` can set environment variables and not command
    # arguments, and every server setting this project depends on is a command
    # argument in `docker-compose.yml`:
    #
    #   --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION,ERROR_FOR_DIVISION_BY_ZERO
    #   --innodb-lock-wait-timeout=10
    #   --default-time-zone=+00:00
    #   --character-set-server / --collation-server
    #   --log-bin-trust-function-creators=1
    #
    # So CI was running on the image's defaults instead, and the step that
    # used to set the last of those by hand — SEC-08's licence-immutability
    # trigger needs it, exactly as the RDS parameter group does — is gone
    # because the compose file carries it.
    #
    # The defaults are a different engine from the one everybody develops
    # against. Read off `mysqld --verbose --help` (8.0.46; sql_mode's default
    # has not moved across 8.0.x, but that is the build I measured, not
    # 8.0.40): sql_mode gains ONLY_FULL_GROUP_BY, NO_ZERO_IN_DATE and
    # NO_ZERO_DATE, and innodb_lock_wait_timeout is 50 rather than 10 — which
    # matters here, because the ledger tests deliberately race concurrent
    # transactions and vitest's own timeout is 30s. A lock the suite expects
    # to give up at 10 seconds would instead be killed by vitest at 30 and
    # reported as a test that hung.
    #
    # `docker compose` is on every GitHub-hosted runner, so the compose file
    # is the definition in both places. Change a flag there and CI follows.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Music service contract tests (no GPU)
        run: |
          python -m pip install -r deploy/dgx/music/server/requirements.txt
          python -m unittest discover -s deploy/dgx/music/server -p 'test_*.py'

      # ffmpeg backs the output checks and export rendering; the audio tests
      # exercise it for real rather than mocking it out.
      # A static build, not apt. On 2026-10-23 `apt-get update && install
      # ffmpeg` took 19 and 24 minutes in the two jobs of one run — the Ubuntu
      # mirrors, not this repository — and both jobs hit their time limits
      # before running a single test. A static binary is one download.
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}

      - name: Start MySQL from docker-compose.yml
        # The test database only — `pnpm db:up` would also start the
        # development one, which nothing in CI reads.
        #
        # Started here and waited for further down, so it boots while the
        # build and the four checks that need no database are running. Those
        # are also the fast failures, and they should not be queued behind a
        # container.
        run: docker compose up -d mysql-test

      - name: Restore cached audio fixtures
        id: fixtures
        uses: actions/cache@v4
        with:
          path: assets/fixtures/audio
          # The generator is the only input: it synthesises every file from
          # scratch with ffmpeg and writes the length into each name. If it
          # changes, the set is regenerated; otherwise this saves about four
          # minutes on every run, which is most of the job.
          key: audio-fixtures-${{ hashFiles('scripts/make-audio-fixtures.mjs') }}

      - name: Generate demo audio fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: pnpm fixtures:audio

      - name: Build workspace
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Orphaned exports
        # Catches a call site removed without its callee — how `wakeBeat`, the
        # only AudioContext resume, was lost for three commits while type
        # checking, the build and screenshots all stayed green. Baselined, so
        # it fails only on new orphans.
        run: pnpm check:orphans

      - name: Dictionary parity
        # Missing keys fall back to Chinese instead of throwing, so a dropped
        # ja key ships as Chinese text on a Japanese page and nothing reports
        # it. Also checks that each translation of a key carries the same
        # {placeholders}.
        run: pnpm check:i18n

      - name: Contrast
        # The old palette carried "faint 4.3:1" as a comment in styles.css and
        # shipped it at 11-13px anyway. A measurement in a comment is a note;
        # this makes it a gate.
        run: pnpm check:contrast

      - name: Stewardship
        # The code is Apache-2.0 and stewarded by the NETX community; the
        # service is operated by someone else, and the 特定商取引法 block names
        # that someone. Both halves are easy to break quietly — a steward's
        # name in a statutory disclosure is a false disclosure, and an
        # operator's home address in an open repository is a leak. This is
        # also where a new file under `spec/` fails until NOTICE carves it out.
        run: pnpm check:stewardship

      - name: Wait for MySQL
        # `--wait` blocks on the healthcheck the compose file already defines,
        # so there is no second readiness loop here to keep in step with it.
        run: docker compose up -d --wait mysql-test

      - name: Report the engine the suite is about to run against
        # Printed, not asserted: these values come from docker-compose.yml, and
        # a check here would only restate that file in a second place. In the
        # log they are what makes an "it passes on my machine" argument
        # settleable in one glance.
        run: |
          mysql -h 127.0.0.1 -P 53307 -uloopscene -ploopscene_local_test \
            -e "SELECT VERSION() AS version, @@sql_mode AS sql_mode,
                       @@innodb_lock_wait_timeout AS lock_wait_s,
                       @@time_zone AS time_zone\G"

      - name: Migrate the test database from empty, twice
        # The harness calls `migrate()` itself, so this is not about coverage —
        # it is about the failure being legible. Migration 0009 was first
        # written dropping an index before adding its replacement and failed
        # with ER_DROP_INDEX_FK, because the old unique key was the only index
        # the foreign key could use. From inside a test run that surfaced as 24
        # files of skipped tests and one serialised error object; here it is a
        # single red step that names the statement.
        #
        # Twice, because a migration that is not idempotent passes its first
        # run and breaks the next deploy instead.
        env:
          DATABASE_URL: mysql://loopscene:loopscene_local_test@127.0.0.1:53307/loopscene_test
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm db:migrate

      - name: Test
        # `pretest` runs check-build-fresh first, which is the gate for the one
        # failure mode that cannot be seen from the output: the suite imports
        # `dist/`, so a stale build means these tests pass against the
        # previous commit's code.
        run: pnpm test
        env:
          TEST_DATABASE_URL: mysql://loopscene:loopscene_local_test@127.0.0.1:53307/loopscene_test

      - name: MySQL logs
        if: failure()
        run: docker compose logs --no-color --tail=100 mysql-test

      - name: Verify the demo configuration boots
        # A mode/adapter combination that cannot start is a build failure, not a
        # deploy-time surprise (§3.1).
        # A literal block scalar, not a plain one. Written as `run: node -e "`
        # with the script on following lines, the `RUN_MODE: 'demo',` inside it
        # is a mapping key to YAML, and the whole file stops parsing — which is
        # what had happened: this workflow has been invalid YAML, and therefore
        # has not run at all, since cc2b918.
        run: |
          node -e "
            const { loadConfig } = require('./apps/api/dist/lib.js');
            const cfg = loadConfig({
              RUN_MODE: 'demo',
              DATABASE_URL: 'mysql://u:p@localhost:3306/x',
              DEV_AUTH_SECRET: 'x'.repeat(32),
              STORAGE_SIGNING_SECRET: 'y'.repeat(32),
            });
            if (cfg.mode !== 'demo') process.exit(1);
            console.log('demo configuration validates');
          "

  ui:
    # UI acceptance: every page at 360, 393, 768 and 1280 px, in a real
    # browser, failing on layout that breaks (scripts/check-ui.mjs says what
    # "breaks" means and why each rule exists).
    #
    # Its own job because it needs the whole demo stack running — api, worker
    # and web — and a browser; and because 1041 green tests once sat beside an
    # admin console that was unusable on a phone. Nothing in build-and-test
    # ever looked at a page at phone width.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_MODE: demo
      PUBLIC_WEB_URL: http://localhost:5173
      PUBLIC_API_URL: http://localhost:4000
      DATABASE_URL: mysql://loopscene:loopscene_local_test@127.0.0.1:53307/loopscene_test
      AUTH_ADAPTER: dev
      DEV_AUTH_SECRET: ci-ui-acceptance-dev-auth-secret-0123456789
      STORAGE_SIGNING_SECRET: ci-ui-acceptance-storage-secret-0123456789
      TEXT_ADAPTER: local
      MUSIC_ADAPTER: demo
      DEMO_FIXTURES_DIR: ./assets/fixtures/audio
      DEMO_LATENCY_MS: '300'
      STORAGE_ADAPTER: local
      QUEUE_ADAPTER: local
      PAYMENTS_ADAPTER: simulated
      # The demo stack's admin has no MFA factor; with MFA required every
      # admin API answers 403 and the console pages show the MFA prompt
      # instead of the console this job exists to look at.
      ADMIN_MFA_REQUIRED: 'false'
      UI_SHOTS: ui-shots
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Start MySQL from docker-compose.yml
        run: docker compose up -d mysql-test

      - name: Restore cached audio fixtures
        id: fixtures
        uses: actions/cache@v4
        with:
          path: assets/fixtures/audio
          key: audio-fixtures-${{ hashFiles('scripts/make-audio-fixtures.mjs') }}

      # Not only for generating fixtures: the worker runs ffmpeg on every
      # delivery, so without it the demo song never finishes. The first run
      # of this job restored the fixtures from cache, skipped the install with
      # them, and waited 60 s for a track that could not be made.
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}

      - name: Generate demo audio fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: pnpm fixtures:audio

      - name: Build workspace
        run: pnpm build

      # Cached, and without `--with-deps`: that flag is apt again (the same
      # mirrors that stalled ffmpeg), and the runner image already carries
      # what Chromium needs because it ships Google Chrome.
      - name: Restore cached Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Migrate and seed the demo database
        run: |
          set -euo pipefail
          docker compose up -d --wait mysql-test
          pnpm db:migrate
          pnpm seed

      - name: Start the demo stack
        run: |
          set -euo pipefail
          nohup pnpm dev > dev.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:4000/v1/runtime >/dev/null && curl -sf http://localhost:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "the demo stack did not come up in three minutes"
          tail -100 dev.log
          exit 1

      - name: UI acceptance
        run: pnpm check:ui

      - name: The stack's log, as an annotation
        # The raw job log is not always reachable (from an agent session it
        # is not); an annotation is, through the checks API and the PR page.
        if: failure()
        run: |
          # Worker lines and warnings/errors only: the api's request log
          # otherwise fills the annotation with the check's own polling.
          grep -E '^\[worker\]|"level":(40|50)|"level":"(warn|error)"|Error' dev.log | tail -40 \
            | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed -e 's/^/::error title=demo stack log::/'
          echo

      - name: Screenshots of what failed, and the stack's log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-acceptance
          path: |
            ui-shots/
            dev.log
          if-no-files-found: ignore

  workflows:
    # Lint the workflows themselves.
    #
    # The one failure mode a CI file cannot report is its own: written as a
    # plain scalar instead of a block scalar, a `run:` step containing
    # `RUN_MODE: 'demo',` made this file invalid YAML, and GitHub's answer to
    # invalid YAML is to not run the workflow — so it sat broken from cc2b918
    # with nothing red anywhere. actionlint parses the schema, checks every
    # expression context and runs shellcheck over each `run:` block, which
    # also covers the quieter version of the same problem: a step that is
    # syntactically fine and silently never executes.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
