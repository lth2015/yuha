name: Deploy QA

on:
  workflow_run:
    workflows: [Artifact Build]
    types: [completed]
    branches: [master, cicd]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA produced by Artifact Build
        required: true
        type: string
      artifact_run_id:
        description: Artifact Build workflow run ID containing the web artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  NAMESPACE: qa-music
  RELEASE: yuha
  EKS_CLUSTER: qa-web3-netx-tokyo-eks
  ECR_REGISTRY: 654654578710.dkr.ecr.ap-northeast-1.amazonaws.com
  WEB_BUCKET: qa-music-web
  CLOUDFRONT_DISTRIBUTION_ID: E3F0OZRA08GGF0

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: qa-music-gha-runner
    timeout-minutes: 30
    environment: qa
    steps:
      - name: Resolve release inputs
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "artifact_run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "commit_sha=${{ inputs.commit_sha }}" >> "$GITHUB_OUTPUT"
            echo "artifact_run_id=${{ inputs.artifact_run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.commit_sha }}

      - name: Install deployment tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/aws-cli"
          curl --fail --silent --show-error --location \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            --output "$RUNNER_TEMP/aws-cli.zip"
          unzip -q -o "$RUNNER_TEMP/aws-cli.zip" -d "$RUNNER_TEMP/aws-cli"
          "$RUNNER_TEMP/aws-cli/aws/install" \
            --install-dir "$RUNNER_TEMP/aws-cli/current" \
            --bin-dir "$RUNNER_TEMP/bin" \
            --update
          export PATH="$RUNNER_TEMP/bin:$PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          aws --version

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Resolve image tag
        id: image
        env:
          SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          date_tag="$(git show -s --date=format:%Y%m%d --format=%cd "$SHA")"
          echo "tag=${date_tag}-${SHA:0:6}" >> "$GITHUB_OUTPUT"

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              ref: payload.ref,
              environment: payload.environment
            });

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Resolve immutable image digests
        id: images
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          api_digest="$(aws ecr describe-images --repository-name music/api --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          worker_digest="$(aws ecr describe-images --repository-name music/worker --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          case "$api_digest" in sha256:*) ;; *) echo "API artifact not found for $IMAGE_TAG"; exit 1 ;; esac
          case "$worker_digest" in sha256:*) ;; *) echo "Worker artifact not found for $IMAGE_TAG"; exit 1 ;; esac
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "worker_digest=$worker_digest" >> "$GITHUB_OUTPUT"

      - name: Download the matching web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ steps.release.outputs.commit_sha }}
          path: apps/web/dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.artifact_run_id }}

      - name: Point kubectl at QA EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Deploy the immutable images
        run: |
          set -euo pipefail
          helm upgrade --install "$RELEASE" infra/helm/loopscene \
            --namespace "$NAMESPACE" \
            --values deploy/envs/qa.yaml \
            --set image.registry="$ECR_REGISTRY" \
            --set image.api.repository=music/api \
            --set image.worker.repository=music/worker \
            --set image.api.digest="${{ steps.images.outputs.api_digest }}" \
            --set image.worker.digest="${{ steps.images.outputs.worker_digest }}" \
            --rollback-on-failure \
            --wait \
            --timeout 15m

      - name: Publish the matching web artifact
        run: |
          set -euo pipefail
          aws s3 sync apps/web/dist/ "s3://$WEB_BUCKET/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'

      - name: Verify the rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment -n "$NAMESPACE" -l app.kubernetes.io/instance="$RELEASE" --timeout=5m
          kubectl run "deploy-check-${GITHUB_RUN_ID}" -n "$NAMESPACE" \
            --rm -i --restart=Never --image=curlimages/curl:8.11.0 --quiet -- \
            curl -fsS --max-time 10 "http://${RELEASE}-api/health"

      - name: Report
        if: always()
        run: |
          {
            echo "### QA Deploy"
            echo ""
            echo "- commit: \`${{ steps.release.outputs.commit_sha }}\`"
            echo "- image tag: \`${{ steps.image.outputs.tag }}\`"
            echo "- artifact run: \`${{ steps.release.outputs.artifact_run_id }}\`"
            echo "- API digest: \`${{ steps.images.outputs.api_digest }}\`"
            echo "- result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
