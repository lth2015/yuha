name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA produced by Artifact Build
        required: true
        type: string
      artifact_run_id:
        description: Artifact Build workflow run ID containing the web artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  NAMESPACE: qa-music
  RELEASE: yuha
  EKS_CLUSTER: qa-web3-netx-tokyo-eks
  ECR_REGISTRY: 654654578710.dkr.ecr.ap-northeast-1.amazonaws.com
  WEB_BUCKET: qa-music-web
  CLOUDFRONT_DISTRIBUTION_ID: E3F0OZRA08GGF0

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Resolve immutable image digests
        id: images
        env:
          SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          api_digest="$(aws ecr describe-images --repository-name music/api --image-ids imageTag="$SHA" --query 'imageDetails[0].imageDigest' --output text)"
          worker_digest="$(aws ecr describe-images --repository-name music/worker --image-ids imageTag="$SHA" --query 'imageDetails[0].imageDigest' --output text)"
          case "$api_digest" in sha256:*) ;; *) echo "API artifact not found for $SHA"; exit 1 ;; esac
          case "$worker_digest" in sha256:*) ;; *) echo "Worker artifact not found for $SHA"; exit 1 ;; esac
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "worker_digest=$worker_digest" >> "$GITHUB_OUTPUT"

      - name: Download the matching web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ inputs.commit_sha }}
          path: apps/web/dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Point kubectl at QA EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Deploy the immutable images
        run: |
          set -euo pipefail
          helm upgrade --install "$RELEASE" infra/helm/loopscene \
            --namespace "$NAMESPACE" --create-namespace \
            --values deploy/envs/qa.yaml \
            --set image.registry="$ECR_REGISTRY" \
            --set image.api.repository=music/api \
            --set image.worker.repository=music/worker \
            --set image.api.digest="${{ steps.images.outputs.api_digest }}" \
            --set image.worker.digest="${{ steps.images.outputs.worker_digest }}" \
            --atomic \
            --wait \
            --timeout 15m

      - name: Publish the matching web artifact
        run: |
          set -euo pipefail
          aws s3 sync apps/web/dist/ "s3://$WEB_BUCKET/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'

      - name: Verify the rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment -n "$NAMESPACE" -l app.kubernetes.io/instance="$RELEASE" --timeout=5m
          kubectl run "deploy-check-${GITHUB_RUN_ID}" -n "$NAMESPACE" \
            --rm -i --restart=Never --image=curlimages/curl:8.11.0 --quiet -- \
            curl -fsS --max-time 10 "http://${RELEASE}-api/health"

      - name: Report
        if: always()
        run: |
          {
            echo "### QA Deploy"
            echo ""
            echo "- commit: \`${{ inputs.commit_sha }}\`"
            echo "- artifact run: \`${{ inputs.artifact_run_id }}\`"
            echo "- API digest: \`${{ steps.images.outputs.api_digest }}\`"
            echo "- result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
