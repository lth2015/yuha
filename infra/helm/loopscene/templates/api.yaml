apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.api.name }}
  labels:
    {{- include "loopscene.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.api.roleArn | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loopscene.name" . }}-api
  labels:
    {{- include "loopscene.labels" . | nindent 4 }}
    component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "loopscene.name" . }}
      component: api
  template:
    metadata:
      labels:
        {{- include "loopscene.labels" . | nindent 8 }}
        component: api
      annotations:
        # Roll pods when non-secret configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.api.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # §4.2: replicas spread across availability zones.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "loopscene.name" . }}
              component: api
      containers:
        - name: api
          image: {{ include "loopscene.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "api/dist/index.js"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            {{- include "loopscene.envVars" . | nindent 12 }}
          envFrom:
            {{- include "loopscene.envFrom" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Readiness checks the database; liveness deliberately does not, so a
          # brief database blip drains traffic instead of restarting every pod.
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loopscene.name" . }}-api
  labels:
    {{- include "loopscene.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "loopscene.name" . }}
    component: api
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "loopscene.name" . }}-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "loopscene.name" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "loopscene.name" . }}-api
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "loopscene.name" . }}
      component: api
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "loopscene.name" . }}-api
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The API's own namespaces, named explicitly rather than left to the
          # catch-all below.
          #
          # `/` alone already routed everything here, so these four changed
          # nothing on the day they were written — which is the point. The
          # moment anything else is put behind this host (a CloudFront origin
          # for the SPA is already built in infra/terraform/compute.tf, and
          # production.yaml points publicWebUrl at this same name), a catch-all
          # is the only rule and the first path to lose is whichever one
          # somebody forgets. `/api` carries the Stripe webhook: losing it
          # means the SPA answers 200 to a signed event and Stripe never
          # retries.
          #
          # What makes them win over `/` is the LENGTH, not this ordering. The
          # AWS Load Balancer Controller sorts an Ingress's paths before it
          # assigns ALB rule priorities — Exact first, then Prefix longest
          # first — which is also what the Ingress spec itself says ("the
          # longest matching path"). So the order here is for a reader, and
          # `pathType: Prefix` is load-bearing: `Exact` on `/api` would route
          # `/api` and send `/api/webhooks/stripe` to the catch-all, which is
          # precisely the silent failure these lines exist to prevent.
          # tests/stripe-webhook-path.test.ts checks the pathType, not the
          # order.
          #
          # `/v1` is the rest of the API and the path the CLI forwarder uses;
          # `/health` and `/ready` are the probes, which answer 200 from a page
          # shell too and so cannot be left to the catch-all either.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "loopscene.name" . }}-api
                port:
                  number: 80
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "loopscene.name" . }}-api
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "loopscene.name" . }}-api
                port:
                  number: 80
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: {{ include "loopscene.name" . }}-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "loopscene.name" . }}-api
                port:
                  number: 80
{{- end }}
