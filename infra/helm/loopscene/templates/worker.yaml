apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.worker.name }}
  labels:
    {{- include "loopscene.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loopscene.name" . }}-worker
  labels:
    {{- include "loopscene.labels" . | nindent 4 }}
    component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "loopscene.name" . }}
      component: worker
  strategy:
    # A worker holds a job lease while it runs. Replacing pods one at a time
    # keeps the number of abandoned leases small; any that do occur expire and
    # are re-claimed (GEN-05).
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "loopscene.labels" . | nindent 8 }}
        component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.worker.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "loopscene.workerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "worker/dist/index.js"]
          env:
            {{- include "loopscene.envVars" . | nindent 12 }}
          envFrom:
            {{- include "loopscene.envFrom" (dict "Values" .Values "Chart" .Chart "envFromSecret" .Values.worker.envFromSecret) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            # ffmpeg needs writable scratch space; the root filesystem stays
            # read-only.
            - name: tmp
              mountPath: /tmp
            - name: aws-secrets
              mountPath: {{ .Values.workerSecretMountPath }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: aws-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "loopscene.name" . }}-worker-secrets
      # Long enough for an in-flight audio render to finish and release its
      # lease cleanly.
      terminationGracePeriodSeconds: 60
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "loopscene.name" . }}-worker
  annotations:
    # §12.3: adding workers does not add upstream capacity. The provider's
    # concurrency quota and the daily budget are the real ceiling, and the
    # application enforces both regardless of replica count.
    loopscene.io/scaling-note: "bounded by provider concurrency and DAILY_BUDGET_MINOR"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "loopscene.name" . }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Slow scale-down avoids interrupting in-flight generations.
      stabilizationWindowSeconds: 300
{{- end }}
{{- if .Values.migrations.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "loopscene.name" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "loopscene.labels" . | nindent 4 }}
  annotations:
    # Migrations run before new pods start, as a reviewable step rather than
    # implicitly on pod boot.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "loopscene.labels" . | nindent 8 }}
        component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.api.name }}
      volumes:
        - name: api-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "loopscene.name" . }}-api-secrets
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: {{ include "loopscene.apiImage" . }}
          command: ["node", "api/node_modules/@yuha/db/dist/cli.js", "migrate"]
          env:
            {{- include "loopscene.envVars" . | nindent 12 }}
          envFrom:
            {{- include "loopscene.envFrom" (dict "Values" .Values "Chart" .Chart "envFromSecret" .Values.api.envFromSecret) | nindent 12 }}
          volumeMounts:
            - name: api-secrets
              mountPath: {{ .Values.apiSecretMountPath }}
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
