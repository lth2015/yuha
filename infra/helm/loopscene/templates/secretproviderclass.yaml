{{- $secretKeys := list "DATABASE_URL" "GOOGLE_CLIENT_SECRET" "GOOGLE_SESSION_SECRET" "STRIPE_SECRET_KEY" "STRIPE_WEBHOOK_SECRET" "TOKENSTARS_API_KEY" "MUSIC_API_KEY" "LEGAL_ENTITY_NAME" "LEGAL_ENTITY_REPRESENTATIVE" "LEGAL_ENTITY_ADDRESS" "LEGAL_ENTITY_CONTACT" "LEGAL_ENTITY_PHONE" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "loopscene.name" . }}-api-secrets
  labels:
    {{- include "loopscene.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.secrets.api.awsSecretName }}"
        objectType: "secretsmanager"
        jmesPath:
{{- range $key := $secretKeys }}
          - path: {{ $key }}
            objectAlias: {{ $key }}
{{- end }}
  secretObjects:
    - secretName: {{ .Values.secrets.api.kubernetesSecretName }}
      type: Opaque
      data:
{{- range $key := $secretKeys }}
        - objectName: {{ $key }}
          key: {{ $key }}
{{- end }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "loopscene.name" . }}-worker-secrets
  labels:
    {{- include "loopscene.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.secrets.worker.awsSecretName }}"
        objectType: "secretsmanager"
        jmesPath:
{{- range $key := $secretKeys }}
          - path: {{ $key }}
            objectAlias: {{ $key }}
{{- end }}
  secretObjects:
    - secretName: {{ .Values.secrets.worker.kubernetesSecretName }}
      type: Opaque
      data:
{{- range $key := $secretKeys }}
        - objectName: {{ $key }}
          key: {{ $key }}
{{- end }}
