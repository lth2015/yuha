# YUHA Helm values.
#
# Two naming domains, and exactly one bridge between them:
#
#   * **AWS** is `loopscene-<environment>` — the EKS cluster, the ECR
#     repositories, the IAM roles, the Secrets Manager entries. Renaming those
#     forces resource recreation, so CLAUDE.md keeps them as they are.
#   * **Inside the cluster** everything is `yuha`: the namespace, the Helm
#     release, the ServiceAccounts, the synced Secret.
#
# The bridge is IRSA. An IRSA trust policy names one exact
# `system:serviceaccount:<namespace>:<name>`, so these ServiceAccount names must
# equal the subjects in `infra/terraform/compute.tf`. They did not until
# 2026-09-28: the chart said `sonare-*`, `deploy/envs/*` said `yuha-*` and
# Terraform trusted `loopscene:loopscene-*`. Nothing catches that — pods start
# and every S3, SQS and Secrets Manager call fails with AccessDenied, which
# reads as a permissions problem rather than a typo.
#
# Secrets are never set here. `envFromSecret` names a Kubernetes Secret that the
# External Secrets Operator (or an equivalent) syncs from AWS Secrets Manager,
# so no credential is stored in the chart, in git, or in Helm release history.

nameOverride: ""
runMode: production

image:
  registry: ""
  # Images are pinned by digest, not by tag: an immutable reference is what
  # makes a rollback deterministic (§4.2 "镜像固定摘要").
  #
  # Repositories have no default. Terraform names them
  # `loopscene-<environment>-{api,worker}`, which the chart cannot know, and the
  # previous defaults (`sonare-*`) named repositories that do not exist in any
  # account — a pull that fails at the end of a deploy rather than at render.
  api:
    repository: ""
    digest: ""
  worker:
    repository: ""
    digest: ""
  pullPolicy: IfNotPresent

# These names are load-bearing: they must match the IRSA subjects in
# `infra/terraform/compute.tf` exactly, in the namespace the release is
# installed into (`yuha`). Changing one without the other silently removes the
# pods' AWS access.
serviceAccount:
  api:
    name: yuha-api
    # eks.amazonaws.com/role-arn, from the Terraform output.
    roleArn: ""
  worker:
    name: yuha-worker
    roleArn: ""

# Name of the synced Kubernetes Secret holding DATABASE_URL, GOOGLE_CLIENT_SECRET,
# GOOGLE_SESSION_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# TOKENSTARS_API_KEY and MUSIC_API_KEY. Created by
# `deploy/cluster/external-secrets.yaml`; the two names must match.
envFromSecret: yuha-runtime

api:
  # §4.2: at least two replicas across two availability zones in production.
  replicaCount: 2
  port: 4000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65

worker:
  replicaCount: 1
  resources:
    requests:
      # ffmpeg is CPU-bound; under-requesting here shows up as slow deliveries.
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1536Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    # §12.3: the real ceiling is the provider's concurrency quota and the daily
    # budget, not this number. Raising it does not buy more upstream capacity.
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  nodeSelector:
    workload: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule

# Runs `db:migrate` as a pre-upgrade hook so the schema is in place before any
# new pod starts. Production API pods do not migrate on boot.
migrations:
  enabled: true

ingress:
  enabled: true
  className: alb
  host: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # The ALB is an entry point, not a place to wait for audio: clients receive
    # a job id and poll (§4.2).
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
  certificateArn: ""

config:
  publicWebUrl: ""
  publicApiUrl: ""
  logLevel: info

  # Primary sign-in: Google OAuth (auth-code + PKCE). The client id is public
  # by nature; GOOGLE_CLIENT_SECRET / GOOGLE_SESSION_SECRET arrive via the
  # synced Secret. "cognito" remains available for deployments that prefer it.
  authAdapter: google
  google:
    clientId: ""
    # `https://<api host>/v1/auth/google/callback`. Byte-identical to the
    # Google Cloud Console entry, and the API's path rather than the web app's
    # — see apps/api/src/auth/google-paths.ts.
    redirectUri: ""
  cognito:
    region: ap-northeast-1
    userPoolId: ""
    appClientId: ""

  storage:
    # S3_REGION used to be rendered from `config.cognito.region`, which happened
    # to hold the same value and so looked correct. Setting the Cognito region —
    # or using Google sign-in and never touching that block — moved the S3
    # region with it.
    region: ap-northeast-1
    quarantineBucket: ""
    deliveryBucket: ""
    kmsKeyId: ""
    downloadUrlTtlSeconds: "300"

  queue:
    region: ap-northeast-1
    url: ""

  tokenstars:
    baseUrl: ""
    modelId: ""
    chatPath: ""
    requestIdHeader: ""
    structuredOutputs: "false"

  music:
    # 'glm' activates the GLM preset over the generic HTTP adapter: defaults
    # live in the app (packages/providers/src/music/glm.ts) and every field
    # below overrides them. 'http' keeps the fully-explicit mapping.
    adapter: glm
    providerId: ""
    baseUrl: ""
    model: ""
    contractVersion: ""
    licenseVersion: ""
    submitPath: ""
    pollPath: ""
    cancelPath: ""
    requestIdField: ""
    statusField: ""
    audioUrlField: ""
    statusMap: '{"pending":[],"completed":[],"failed":[],"rejected":[]}'
    idempotencyHeader: ""
    allowedAudioHosts: ""
    supportsInstrumental: "false"
    supportsCancel: "false"
    supportsWebhook: "false"
    supportsStatusQuery: "true"
    # Stays false until a signed agreement covers delivering output (SEC-09).
    commercialDelivery: "false"
    dataRegion: unconfirmed
    costMinorPerRequest: "45"
    billFailedRequests: "true"
    costIsEstimate: "true"

  stripe:
    publishableKey: ""
    # Each key is named for our internal price key; the comment is the Stripe
    # dashboard's name for the same product. They do not match, and the two
    # monthly plans differ only in price. After changing any of these, run
    # `pnpm check:stripe-prices` against the same configuration: it reads each
    # Price back from Stripe and refuses a swap — but it is a command somebody
    # runs, not part of the rollout, so these comments and that command are
    # both the protection.
    priceIdDrop5: ""           # DROP — 5 songs, ¥980 one-off
    priceIdProMonthly: ""      # CREATOR — 15 songs / month, ¥1,980
    priceIdPremierMonthly: ""  # STUDIO — 45 songs / month, ¥3,980
    priceIdMarketLicense: ""   # Licence — one song, ¥980 one-off
    # The version this code is written against: an Invoice's subscription under
    # `parent.subscription_details`, a Subscription's period on its items, and
    # the minimum an account with Managed Payments accepts. Not a secret, and
    # not left to the SDK's own pin.
    apiVersion: "2025-03-31.basil"

  features:
    subscriptionsEnabled: "true"
    freeTrialEnabled: "true"
    wavExportEnabled: "false"

  limits:
    maxConcurrentJobsPerUser: "2"
    dailyBudgetMinor: "50000"
    generationRateLimitPerHour: "30"
    exportRateLimitPerHour: "60"
    # Credits an operator may hand out. 0 on the first switches gifting off;
    # 0 on either daily total REMOVES that limit — the two zeros mean opposite
    # things, which is why they are commented separately.
    adminGrantMaxUnits: "100"
    adminGrantMaxUnitsPerDay: "500"
    adminGrantValidityDays: "90"
    adminCompensationMaxUnitsPerDay: "2000"
    # What one customer may buy in a rolling day (FRAUD_PREVENTION ③).
    purchaseCapJpyPerDay: "50000"
    purchaseCapOrdersPerDay: "20"

  # SEC-13 (特定商取引法) has no values here any more.
  #
  # There was a blank `legal:` block, so that `deploy/envs/*.yaml` could fill
  # it in. That made one person's name, home address, telephone number and
  # personal email into chart values, tracked in git and rendered into a
  # ConfigMap. The five variables now come from the runtime Secret
  # (`envFromSecret`), so neither this file nor any environment's values file
  # knows them. Production still refuses to start without name, address and
  # contact — that check is in `loadConfig`, not here.

podDisruptionBudget:
  enabled: true
  minAvailable: 1
