apiVersion: v1
kind: ConfigMap
metadata:
  name: yuha-config
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app.kubernetes.io/name: yuha
    app.kubernetes.io/instance: yuha
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  # Non-sensitive configuration only. Every secret arrives through the synced
  # Secret named by .Values.envFromSecret.
  PUBLIC_WEB_URL: "https://qa.yuha.studio"
  PUBLIC_API_URL: "https://qa.yuha.studio"
  LOG_LEVEL: "info"
  HOST: "0.0.0.0"
  PORT: "4000"
  DATABASE_SSL: "true"
  DATABASE_HOST: "qa-music-database.cn0qgmcaw2fj.ap-northeast-1.rds.amazonaws.com"
  DATABASE_PORT: "3306"
  DATABASE_NAME: "music"

  AUTH_ADAPTER: "google"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_REDIRECT_URI: "https://qa.yuha.studio/v1/auth/google/callback"
  COGNITO_REGION: "ap-northeast-1"
  COGNITO_USER_POOL_ID: ""
  COGNITO_APP_CLIENT_ID: ""

  STORAGE_ADAPTER: "s3"
  S3_REGION: "ap-northeast-1"
  S3_QUARANTINE_BUCKET: ""
  S3_DELIVERY_BUCKET: ""
  S3_KMS_KEY_ID: ""
  DOWNLOAD_URL_TTL_SECONDS: "900"

  QUEUE_ADAPTER: "sqs"
  SQS_REGION: "ap-northeast-1"
  SQS_QUEUE_URL: ""

  TEXT_ADAPTER: "tokenstars"
  TOKENSTARS_BASE_URL: ""
  TOKENSTARS_MODEL_ID: ""
  TOKENSTARS_CHAT_PATH: "/v1/chat/completions"
  TOKENSTARS_REQUEST_ID_HEADER: "x-request-id"
  TOKENSTARS_STRUCTURED_OUTPUTS: "true"

  MUSIC_ADAPTER: "demo"
  MUSIC_PROVIDER_ID: "demo-local"
  MUSIC_BASE_URL: ""
  MUSIC_MODEL: ""
  MUSIC_CONTRACT_VERSION: ""
  MUSIC_LICENSE_VERSION: ""
  MUSIC_SUBMIT_PATH: ""
  MUSIC_POLL_PATH: ""
  MUSIC_CANCEL_PATH: ""
  MUSIC_REQUEST_ID_FIELD: ""
  MUSIC_STATUS_FIELD: ""
  MUSIC_AUDIO_URL_FIELD: ""
  MUSIC_STATUS_MAP: "{\"pending\":[],\"completed\":[],\"failed\":[],\"rejected\":[]}"
  MUSIC_IDEMPOTENCY_HEADER: ""
  MUSIC_ALLOWED_AUDIO_HOSTS: ""
  MUSIC_SUPPORTS_INSTRUMENTAL: "true"
  MUSIC_SUPPORTS_CANCEL: "false"
  MUSIC_SUPPORTS_WEBHOOK: "false"
  MUSIC_SUPPORTS_STATUS_QUERY: "true"
  MUSIC_COMMERCIAL_DELIVERY: "false"
  MUSIC_DATA_REGION: "ap-northeast-1"
  MUSIC_COST_MINOR_PER_REQUEST: "45"
  MUSIC_BILL_FAILED_REQUESTS: "true"
  MUSIC_COST_IS_ESTIMATE: "true"

  PAYMENTS_ADAPTER: "stripe"
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_PRICE_ID_DROP_5: ""
  STRIPE_PRICE_ID_PRO_MONTHLY: ""
  STRIPE_PRICE_ID_PREMIER_MONTHLY: ""
  # The market licence was live in Stripe and reached no pod: this key was
  # missing from the ConfigMap entirely, so `stripe_price_id` seeded as NULL
  # and buying a licence 500'd on the checkout call.
  STRIPE_PRICE_ID_MARKET_LICENSE: ""
  # Pinned, not inherited from the SDK. The API refuses to start in production
  # without it, because the webhook payload shape depends on it.
  STRIPE_API_VERSION: "2025-03-31.basil"

  # What bounds the two paths that mint credits, and the purchase cap.
  #
  # Every one of these was a code default with no deployment surface at all —
  # the ConfigMap is a fixed list with no pass-through, so on Kubernetes they
  # could not be changed without editing the chart. docs/OPERATIONS.md calls
  # ADMIN_GRANT_MAX_UNITS_PER_DAY "the limit that matters if an operator
  # account is compromised", which is not a thing to leave unsettable. Same
  # defect the licence price id had one commit earlier.
  ADMIN_GRANT_MAX_UNITS: "100"
  ADMIN_GRANT_MAX_UNITS_PER_DAY: "500"
  ADMIN_GRANT_VALIDITY_DAYS: "90"
  ADMIN_COMPENSATION_MAX_UNITS_PER_DAY: "2000"
  PURCHASE_CAP_JPY_PER_DAY: "50000"
  PURCHASE_CAP_ORDERS_PER_DAY: "20"

  FEATURE_SUBSCRIPTIONS_ENABLED: "true"
  FEATURE_FREE_TRIAL_ENABLED: "true"
  FEATURE_WAV_EXPORT_ENABLED: "false"

  MAX_CONCURRENT_JOBS_PER_USER: "3"
  DAILY_BUDGET_MINOR: "50000"
  GENERATION_RATE_LIMIT_PER_HOUR: "60"
  EXPORT_RATE_LIMIT_PER_HOUR: "120"

  # The five LEGAL_ENTITY_* variables are deliberately absent.
  #
  # They were here, read from `.Values.config.legal`, which meant the operator's
  # legal name, home address, telephone number and personal email were in a
  # values file in git and in an unencrypted ConfigMap any `kubectl get cm`
  # prints. The operator is a sole proprietor: that is personal data, not
  # configuration. They come through `.Values.envFromSecret` instead
  # (`deploy/cluster/external-secrets.yaml`), which the helper lists *after*
  # this ConfigMap — so re-adding them here would not even win, it would only
  # publish them.

