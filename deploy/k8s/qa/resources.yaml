# Source: yuha/templates/worker.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yuha-worker
  annotations:
    # §12.3: adding workers does not add upstream capacity. The provider's
    # concurrency quota and the daily budget are the real ceiling, and the
    # application enforces both regardless of replica count.
    loopscene.io/scaling-note: "bounded by provider concurrency and DAILY_BUDGET_MINOR"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yuha-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Slow scale-down avoids interrupting in-flight generations.
      stabilizationWindowSeconds: 300
---

# Source: yuha/templates/api.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yuha-api
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: "yuha.studio"
      http:
        paths:
          # The API's own namespaces, named explicitly rather than left to the
          # catch-all below.
          #
          # `/` alone already routed everything here, so these four changed
          # nothing on the day they were written — which is the point. The
          # moment anything else is put behind this host (a CloudFront origin
          # for the SPA is already built in infra/terraform/compute.tf, and
          # production.yaml points publicWebUrl at this same name), a catch-all
          # is the only rule and the first path to lose is whichever one
          # somebody forgets. `/api` carries the Stripe webhook: losing it
          # means the SPA answers 200 to a signed event and Stripe never
          # retries.
          #
          # What makes them win over `/` is the LENGTH, not this ordering. The
          # AWS Load Balancer Controller sorts an Ingress's paths before it
          # assigns ALB rule priorities — Exact first, then Prefix longest
          # first — which is also what the Ingress spec itself says ("the
          # longest matching path"). So the order here is for a reader, and
          # `pathType: Prefix` is load-bearing: `Exact` on `/api` would route
          # `/api` and send `/api/webhooks/stripe` to the catch-all, which is
          # precisely the silent failure these lines exist to prevent.
          # tests/stripe-webhook-path.test.ts checks the pathType, not the
          # order.
          #
          # `/v1` is the rest of the API and the path the CLI forwarder uses;
          # `/health` and `/ready` are the probes, which answer 200 from a page
          # shell too and so cannot be left to the catch-all either.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: yuha-api
                port:
                  number: 80
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: yuha-api
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: yuha-api
                port:
                  number: 80
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: yuha-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yuha-api
                port:
                  number: 80
