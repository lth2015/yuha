# Syncs AWS Secrets Manager into the Secret the chart mounts.
#
# `infra/helm/loopscene/values.yaml` says `envFromSecret: yuha-runtime` and
# notes that "the External Secrets Operator (or an equivalent) syncs it from
# AWS Secrets Manager". Nothing did. Terraform creates both secrets and grants
# the pods' IRSA roles `secretsmanager:GetSecretValue`, and the chart mounts a
# Secret that never existed — pods would have started with no DATABASE_URL.
#
# Substitute __NAMESPACE__ (`yuha`), __ENVIRONMENT__ and __ACCOUNT_ID__; the
# deploy workflow does that. __NAMESPACE__ used to be missing from this list
# while the file used it three times, so following these instructions left
# `namespace: __NAMESPACE__` in the applied manifest.
#
# The namespace and the ServiceAccount name below are not cosmetic: the IRSA
# trust policy in infra/terraform/compute.tf names
# `system:serviceaccount:yuha:yuha-external-secrets` exactly. Rename either and
# the SecretStore cannot authenticate, which surfaces as AccessDenied from
# Secrets Manager rather than as a naming mistake.
#
# Requires the External Secrets Operator to be installed first (see
# ../runbook.md).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yuha-external-secrets
  namespace: __NAMESPACE__
  annotations:
    # Reuses the API role, which Terraform already grants read access to both
    # secrets, and whose trust policy lists this ServiceAccount alongside
    # `yuha-api`. A separate role would need its own Terraform change.
    eks.amazonaws.com/role-arn: arn:aws:iam::__ACCOUNT_ID__:role/loopscene-__ENVIRONMENT__-api
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: __NAMESPACE__
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: yuha-external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: yuha-runtime
  namespace: __NAMESPACE__
spec:
  # Long enough not to hammer Secrets Manager, short enough that a rotated
  # credential reaches the pods without a redeploy.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: yuha-runtime
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: loopscene-__ENVIRONMENT__/database
        property: url

    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: TOKENSTARS_API_KEY
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: TOKENSTARS_API_KEY
    - secretKey: MUSIC_API_KEY
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: MUSIC_API_KEY

    # These two are listed in the chart's envFromSecret comment but are NOT in
    # Terraform's placeholder for `loopscene-<env>/app`. The sync will report a
    # missing property until they are added to that secret out of band, which
    # is the correct failure: Google sign-in cannot work without them, and a
    # silently absent key would look like a login bug instead.
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: GOOGLE_CLIENT_SECRET
    - secretKey: GOOGLE_SESSION_SECRET
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: GOOGLE_SESSION_SECRET

    # 特定商取引法 disclosure (SEC-13). Not secrets in the usual sense — every
    # one of these five is published on /legal/tokushoho — but the operator is
    # a sole proprietor, so they are one person's legal name, home address,
    # telephone number and personal email. They used to be values in
    # `deploy/envs/*.yaml` and a ConfigMap: in git, in a repository that is
    # becoming open source, and readable from any `kubectl get cm`. Here they
    # reach the pods without being written down anywhere in this repository.
    #
    # Like the two above, these are NOT in Terraform's placeholder for
    # `loopscene-<env>/app`, so the sync reports a missing property until they
    # are added to that secret out of band — `deploy/runbook.md` §「法定表示」.
    # That is the correct failure: production refuses to start without NAME,
    # ADDRESS and CONTACT (`loadConfig`, SEC-13), so a missing property stops
    # the rollout instead of publishing a blank statutory disclosure.
    - secretKey: LEGAL_ENTITY_NAME
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: LEGAL_ENTITY_NAME
    - secretKey: LEGAL_ENTITY_REPRESENTATIVE
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: LEGAL_ENTITY_REPRESENTATIVE
    - secretKey: LEGAL_ENTITY_ADDRESS
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: LEGAL_ENTITY_ADDRESS
    - secretKey: LEGAL_ENTITY_CONTACT
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: LEGAL_ENTITY_CONTACT
    - secretKey: LEGAL_ENTITY_PHONE
      remoteRef:
        key: loopscene-__ENVIRONMENT__/app
        property: LEGAL_ENTITY_PHONE
