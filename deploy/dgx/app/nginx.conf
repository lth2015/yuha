server {
  listen 80;
  client_max_body_size 30m;
  root /web;
  # API, signed audio files and the Stripe webhook all live under /v1; the
  # Stripe webhook ALSO lives under /api, which is the path the live endpoint
  # is configured with. Resolve the api container per request through Docker's
  # DNS. A literal `proxy_pass http://api:4000` is resolved once when nginx
  # starts, so every redeploy (which recreates api with a new IP) left this
  # proxying to the old address and the whole site answering 502 until web was
  # restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /v1/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  # /api/ reaches the backend, and this block is why.
  #
  # Without it `/api/webhooks/stripe` fell through to the SPA block below and
  # answered 200 with index.html — a page, to a POST, with a Stripe signature
  # on it. Stripe treats 200 as delivered, so every live event would have been
  # acknowledged and discarded: a paid order with no credits granted and
  # nothing in the dashboard suggesting a problem. The same shape as `/health`
  # answering 200 from the page shell, noted in deploy/dgx/README.md.
  #
  # `proxy_pass` with a variable and no URI part passes the request URI
  # unchanged, so the backend sees `/api/webhooks/stripe` and not `/webhooks/
  # stripe` — which matters, because that is the route it registers.
  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /assets/ { try_files $uri =404; expires 7d; }
  # SPA: every other path is the app.
  location / { try_files $uri /index.html; }
}
