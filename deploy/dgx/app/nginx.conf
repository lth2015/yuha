server {
  listen 80;
  client_max_body_size 30m;
  root /web;
  # API, signed audio files and the Stripe webhook all live under /v1.
  # Resolve the api container per request through Docker's DNS. A literal
  # `proxy_pass http://api:4000` is resolved once when nginx starts, so every
  # redeploy (which recreates api with a new IP) left this proxying to the old
  # address and the whole site answering 502 until web was restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /v1/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /assets/ { try_files $uri =404; expires 7d; }
  # SPA: every other path is the app.
  location / { try_files $uri /index.html; }
}
