services:
  video:
    build:
      context: .
      args:
        NGC_TAG: ${NGC_TAG:-25.09-py3}
        VIDEO_PIPELINE: ${VIDEO_PIPELINE:-LTXPipeline}
    image: yuha-video:latest
    container_name: yuha-video
    restart: unless-stopped
    env_file: .env
    ports:
      # Loopback only: the public side is the TLS proxy on 443. Docker's published
      # ports bypass ufw, so a 0.0.0.0 bind here would be open whatever the firewall says.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8100}:8100"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface   # weights, downloaded on first start
      - ./data:/data                                         # jobs + clips, swept after RETENTION_HOURS
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
