# Helm values for production. Non-secret configuration only.
#
# **Production cannot be deployed from this file today, on purpose.** No music
# provider agreement is signed, so `music.adapter` is `demo`, and the API
# refuses to start in production mode with a fake music adapter. Selling
# synthetic audio is the outcome that refusal prevents. Nothing here works
# around it; see docs/OPEN_ITEMS.md §1.
#
# Every empty string below is an output of `terraform apply` in
# infra/terraform/, which has never been run against a real account.
#
# Where the refusal happens: the *chart* fails at render only for the values it
# alone can know — registry, repository, digest, and runMode. Everything else is
# checked by the API at startup, which lists every missing or contradictory
# setting by name and exits. So a half-configured release renders and then
# refuses to run, loudly and specifically, rather than serving with a blank
# bucket name. This paragraph used to claim the chart caught all of it; it does
# not, and knowing which layer speaks matters when you are reading logs.
nameOverride: yuha
runMode: production

image:
  # <account>.dkr.ecr.ap-northeast-1.amazonaws.com — from the ECR outputs.
  registry: ""
  # Terraform names these `loopscene-<environment>-{api,worker}`. The chart has
  # no default and fails at render if this is empty.
  api:
    repository: loopscene-production-api
    digest: ""   # set by the workflow, never committed
  worker:
    repository: loopscene-production-worker
    digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  api:
    name: yuha-api
    roleArn: ""      # terraform output api_role_arn
  worker:
    name: yuha-worker
    roleArn: ""      # terraform output worker_role_arn

envFromSecret: yuha-runtime

api:
  replicaCount: 2
  port: 4000

ingress:
  enabled: true
  className: alb
  host: "yuha.studio"   # the product's official domain
  certificateArn: "" # ACM certificate in ap-northeast-1

config:
  # One host, and today the ALB Ingress routes EVERY path on it to the api
  # service — `/` is a catch-all, with /api, /v1, /health and /ready listed
  # ahead of it. So nothing serves the SPA on this name yet: the web bundle
  # goes to the S3 + CloudFront distribution in infra/terraform/compute.tf,
  # which has its own domain. Pointing publicWebUrl here is the intended end
  # state, not a description of what a browser gets today, and closing that
  # gap means giving the SPA a path rule or putting CloudFront in front. This
  # comment claimed "/v1 is routed to the api" while the chart routed
  # everything; the four explicit paths exist so that, whichever way it is
  # closed, /api/webhooks/stripe still reaches the backend. The
  # DNS record and the ACM certificate for this name are SRE's to create —
  # `certificateArn` above is still empty and the chart renders without it, so
  # that is worth checking before the first real deploy.
  publicWebUrl: "https://yuha.studio"
  publicApiUrl: "https://yuha.studio"
  logLevel: warn

  authAdapter: google
  google:
    # The OAuth 2.0 **Web application** client id from the Google Cloud
    # Console. Not a secret (it is in the authorization URL); the client
    # SECRET and GOOGLE_SESSION_SECRET are in Secrets Manager.
    clientId: ""   # <id>.apps.googleusercontent.com
    # Must be byte-identical to an entry in that client's "Authorized redirect
    # URIs", and must be the API's path — NOT the web app's
    # /auth/google/callback, which is where this server sends the browser
    # afterwards and which Google must never be given. The API refuses to
    # start if the path or the origin is wrong; Google answers
    # redirect_uri_mismatch on its own page, which leaves no trace here.
    redirectUri: "https://yuha.studio/v1/auth/google/callback"
  cognito:
    region: ap-northeast-1
    userPoolId: ""   # terraform output cognito_user_pool_id
    appClientId: ""  # terraform output cognito_app_client_id

  storage:
    region: ap-northeast-1
    quarantineBucket: ""  # terraform output quarantine_bucket
    deliveryBucket: ""    # terraform output delivery_bucket
    kmsKeyId: ""          # terraform output kms_media_key_arn
    downloadUrlTtlSeconds: 900

  queue:
    region: ap-northeast-1
    url: ""               # terraform output sqs_queue_url

  tokenstars:
    baseUrl: ""
    modelId: ""
    chatPath: /v1/chat/completions
    requestIdHeader: x-request-id
    structuredOutputs: "true"

  music:
    # Switch to the real adapter only once an agreement is signed; until then
    # production would be selling synthetic audio.
    #
    # This is also why production cannot be deployed today: `runMode: production`
    # plus `adapter: demo` is refused at startup with "production mode cannot use
    # the demo (fake) music adapter". That refusal is correct and this file does
    # not work around it — see the header.
    adapter: demo
    providerId: demo-local
    baseUrl: ""
    model: ""
    contractVersion: ""
    licenseVersion: ""
    submitPath: ""
    pollPath: ""
    cancelPath: ""
    requestIdField: ""
    statusField: ""
    audioUrlField: ""
    statusMap: '{"pending":[],"completed":[],"failed":[],"rejected":[]}'
    idempotencyHeader: ""
    allowedAudioHosts: ""
    supportsInstrumental: "true"
    supportsCancel: "false"
    supportsWebhook: "false"
    supportsStatusQuery: "true"
    # No signed agreement with a music provider yet, so the demo adapter stays
    # and the cost figure stays flagged as modelled.
    commercialDelivery: "false"
    dataRegion: ap-northeast-1
    # 45 JPY and "failures are billable" are the figures docs/OPEN_ITEMS.md §4
    # and §6 record as the deliberate, conservative assumptions. These overrides
    # quietly said 46 and "false"; assuming failures are free understates cost,
    # which is the direction that hurts.
    costMinorPerRequest: "45"
    billFailedRequests: "true"
    costIsEstimate: "true"

  stripe:
    # Four live Prices, one per catalogue row, all `price_...` ids from the
    # LIVE dashboard — a test-mode id here is a checkout that 400s on every
    # purchase. SRE fills these in; nothing in this repo generates or guesses
    # one, and the secret key and the endpoint signing secret are not here at
    # all (they come from the `yuha-runtime` Secret, see deploy/cluster).
    publishableKey: ""        # pk_live_...
    priceIdDrop5: ""          # DROP — 5 songs, ¥980
    priceIdProMonthly: ""     # CREATOR — 15 songs / month, ¥1,980
    priceIdPremierMonthly: "" # STUDIO — 45 songs / month, ¥3,980
    priceIdMarketLicense: ""  # Licence — one song, ¥980
    apiVersion: "2025-03-31.basil"

  features:
    subscriptionsEnabled: "true"
    freeTrialEnabled: "false"
    wavExportEnabled: "false"

  limits:
    maxConcurrentJobsPerUser: "3"
    dailyBudgetMinor: "50000"
    generationRateLimitPerHour: "60"
    exportRateLimitPerHour: "120"

  # production mode refuses to start unless entityName, address and contact are
  # all non-empty — the 特定商取引法 disclosure must not be a placeholder. These
  # overrides used to blank out even the name the chart already knows.
  #
  # The operator is a sole proprietor (個人事業主), so 販売業者 and 代表者 are
  # the same person. <redacted: operator name> is the Japanese-kanji form of the name, which is
  # what a Japanese statutory page prints.
  legal:
    entityName: "<redacted: operator name>"
    representative: "<redacted: operator name>"
    # 住所, in the form the operator gave as the registered one. The 〒 is
    # prefixed because a Japanese statutory disclosure conventionally carries
    # it; <redacted: operator region> is deliberately NOT, even though convention would add it,
    # because <redacted: operator region> is a 政令指定都市 and the registered form omits the
    # prefecture. The registered form wins over the convention.
    address: "<redacted: operator address>"
    contact: "redacted-operator@example.invalid"
    # <redacted: operator phone>, hyphenated the way a Japanese disclosure prints it.
    phone: "<redacted: operator phone>"
