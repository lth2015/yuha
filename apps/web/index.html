<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- #08090d was the deleted dark theme. The document said dark while
         styles.css said light, so Android Chrome and iOS Safari framed a
         warm-white app in near-black. --bg, by hand: a meta cannot read a
         custom property. -->
    <meta name="theme-color" content="#f6f5f0" />
    <title>YUHA — 让心动，有回声。</title>
    <meta
      name="description"
      content="写下一段心情，做成属于这一刻的音乐。YUHA（羽花）把一个人暂时说不清的感觉，变成可以听见的旋律。"
    />
    <meta property="og:title" content="YUHA — 让心动，有回声。" />
    <meta
      property="og:description"
      content="描述一种心情，创作一段属于此刻的音乐。"
    />
    <meta property="og:type" content="website" />
    <!--
      Every link to the site previews with a picture (scripts/make-og-card.mjs).
      A shared song has its own card instead: /v1/share/songs/:id.
    -->
    <meta property="og:image" content="https://yuha.studio/brand/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- What the site is, for search engines. No operator details here: those come from the disclosure API. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "YUHA",
        "url": "https://yuha.studio/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "inLanguage": ["zh-Hans", "ja", "en"],
        "description": "Describe a feeling and get a finished song — sung or instrumental, 30 seconds to 4 minutes, with lyrics in English, Japanese or Chinese."
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand/yuha-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/yuha-favicon-32.png" />
    <!--
      Type: M PLUS 2 carries Latin and Japanese; Chinese falls through to the
      platform faces in --font. Google Fonts subsets by unicode-range, so the
      CJK payload only ships for the glyphs a page actually uses.
      The brand wordmark stays SVG, never text.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@300;400;500;700&display=swap"
    />
  </head>
  <body>
    <!--
      What a reader that does not run JavaScript gets: most language-model
      crawlers fetch HTML and stop. React replaces all of it on start
      (createRoot().render), so a person sees it only until the app draws.
      docs/SEO_SPEC.md; the full description is /llms.txt.
    -->
    <div id="root">
      <main style="max-width: 40rem; margin: 15vh auto; padding: 0 1rem; font: 16px/1.7 system-ui, sans-serif; color: #5b5d57">
        <h1 style="font-size: 1.5rem; color: #1f201c">YUHA — 让心动，有回声。</h1>
        <p lang="zh-CN">写下一种心情，生成一首完整的歌：有人声或纯音乐，30 秒到 4 分钟，中文、日文、英文歌词都可以。作品默认私密。</p>
        <p lang="ja">気持ちを書くと、1 曲の歌ができます。ボーカルありでもインストでも、30 秒から 4 分まで。作品は初期設定で非公開です。</p>
        <p lang="en">Describe a feeling and get a finished song — sung or instrumental, 30 seconds to 4 minutes. Songs are private by default.</p>
        <p><a href="/pricing">Pricing</a> · <a href="/help/rights">Rights</a> · <a href="/legal">Legal</a> · <a href="/llms.txt">llms.txt</a></p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
