<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="robots" content="noindex" />
    <title>YUHA 空气作曲</title>
  </head>
  <body>
    <!-- Every word comes from src/play/i18n.ts: data-i18n fills the text, data-i18n-aria the label. -->
    <main id="stage" role="application" tabindex="0" data-i18n-aria="stage.aria">
      <canvas id="light" aria-hidden="true"></canvas>
      <p id="hint" data-i18n="hint"></p>
    </main>
    <!-- The way out: the YUHA mark goes home, and so does ×. Outside #stage, so a tap here never plays. -->
    <nav id="topbar">
      <a id="home" href="https://yuha.studio/" data-i18n-aria="home.aria">
        <svg viewBox="0 0 96 96" aria-hidden="true" focusable="false">
          <path d="M81 12C83 41 62 71 27 85C31 70 43 55 54 47C66 37 75 24 81 12Z" />
          <path d="M14 24C37 23 53 34 54 49C40 47 22 38 14 24Z" />
        </svg>
        <span data-i18n="home"></span>
      </a>
      <a id="close" href="https://yuha.studio/" data-i18n-aria="close.aria">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </a>
    </nav>
    <div id="ring" hidden>
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <circle class="track" cx="30" cy="30" r="26" />
        <circle id="ring-arc" cx="30" cy="30" r="26" />
      </svg>
      <button id="done" type="button" data-i18n="done"></button>
    </div>
    <section id="ended" hidden aria-live="polite">
      <p class="length" id="ended-length"></p>
      <div class="actions">
        <button id="replay" type="button"></button>
        <button id="again" type="button" class="quiet" data-i18n="again"></button>
        <button id="share" type="button" class="quiet" data-i18n="share"></button>
      </div>
      <button id="to-song" type="button" class="link" data-i18n="toSong"></button>
      <input id="share-url" type="text" readonly hidden data-i18n-aria="shareUrl.aria" />
    </section>
    <section id="shared" hidden aria-live="polite">
      <p class="length" id="shared-length"></p>
      <div class="actions">
        <button id="listen" type="button"></button>
        <button id="own" type="button" class="quiet" data-i18n="own"></button>
      </div>
    </section>
    <section id="card" hidden aria-labelledby="card-mood">
      <p class="eyebrow" data-i18n="card.eyebrow"></p>
      <h2 id="card-mood"></h2>
      <p id="card-words" class="words"></p>
      <dl class="facts">
        <div><dt data-i18n="card.mood"></dt><dd id="card-fact-mood"></dd></div>
        <div><dt data-i18n="card.tempo"></dt><dd id="card-tempo"></dd></div>
        <div><dt data-i18n="card.energy"></dt><dd id="card-energy"></dd></div>
      </dl>
      <div class="voice" role="group" aria-labelledby="card-voice-label">
        <span id="card-voice-label" data-i18n="card.vocals"></span>
        <button id="card-sung" type="button" aria-pressed="true" data-i18n="card.sung"></button>
        <button id="card-inst" type="button" aria-pressed="false" data-i18n="card.instrumental"></button>
      </div>
      <p id="card-voice-note" class="fine" data-i18n="card.sungNote"></p>
      <a id="card-go" href="https://yuha.studio/" data-i18n="card.go"></a>
      <p class="fine" data-i18n="card.cost"></p>
      <button id="card-back" type="button" class="quiet" data-i18n="card.back"></button>
    </section>
    <p id="toast" role="status" hidden></p>
    <script type="module" src="./src/play/main.ts"></script>
  </body>
</html>
