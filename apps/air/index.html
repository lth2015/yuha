<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="robots" content="noindex" />
    <title>YUHA 空气作曲</title>
  </head>
  <body>
    <main id="stage" aria-label="空气作曲：触碰屏幕并移动手指，声音会随之变化">
      <canvas id="light" aria-hidden="true"></canvas>
      <p id="hint">触碰，让感觉先有声音</p>
    </main>
    <div id="ring" hidden>
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <circle class="track" cx="30" cy="30" r="26" />
        <circle id="ring-arc" cx="30" cy="30" r="26" />
      </svg>
      <button id="done" type="button">完成</button>
    </div>
    <section id="ended" hidden aria-live="polite">
      <p class="length">你的 <span id="ended-length"></span></p>
      <div class="actions">
        <button id="replay" type="button">回放</button>
        <button id="again" type="button" class="quiet">重来</button>
        <button id="share" type="button" class="quiet">复制链接</button>
      </div>
      <input id="share-url" type="text" readonly hidden aria-label="分享链接" />
    </section>
    <section id="shared" hidden aria-live="polite">
      <p class="length">一段空气作曲 · <span id="shared-length"></span></p>
      <div class="actions">
        <button id="listen" type="button">聆听</button>
        <button id="own" type="button" class="quiet">自己来一段</button>
      </div>
    </section>
    <p id="toast" role="status" hidden></p>
    <script type="module" src="./src/play/main.ts"></script>
  </body>
</html>
